<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello Pyxis</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem;
           background: #1e293b; color: #f8fafc; }
    h1 { color: #34d399; }
    pre { background: #0f172a; padding: 1rem; border-radius: 8px;
          white-space: pre-wrap; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Hello Pyxis</h1>
  <p>Third-party app installed from an .ipk — alpha 4 acceptance test.</p>
  <pre id="out">probing…</pre>
  <script>
    // Write the probe result to a file so a headless serial run can read it.
    // A mapped Wayland surface only proves a window exists; this proves the
    // pyxis:// origin served the document, the script ran, window.geckoOS
    // attached for a *third-party* origin, and Nova's appinfo->capability
    // mapping actually granted filesystem:write to an ordinary opkg app.
    const PROOF = '/tmp/pyxis-hello-proof.txt';
    // Chrome visibility, measured rather than looked at. These barprops are
    // standard DOM and readable from content, and they reflect the window
    // features openPyxisAppWindow passed (toolbar=no, location=no,
    // menubar=no). If a relaunch comes up with Firefox chrome, these are
    // what say so from inside a headless run — there is no screenshot
    // channel, and the existing PYXIS-DIAG only proves the chromeless code
    // PATH ran, not that the chrome is actually hidden.
    const CHROME = [
      'toolbar=' + (window.toolbar ? window.toolbar.visible : '?'),
      'locationbar=' + (window.locationbar ? window.locationbar.visible : '?'),
      'menubar=' + (window.menubar ? window.menubar.visible : '?'),
      'personalbar=' + (window.personalbar ? window.personalbar.visible : '?'),
      'statusbar=' + (window.statusbar ? window.statusbar.visible : '?'),
      'outer=' + window.outerWidth + 'x' + window.outerHeight,
      'inner=' + window.innerWidth + 'x' + window.innerHeight,
    ].join(' ');
    const out = document.getElementById('out');
    // probe() can run twice (geckoOSReady and the timeout fallback below),
    // so raise at most one notification per page load.
    let notified = false;
    let beeped = false;

    async function probe() {
      const lines = [
        'origin=' + location.origin,
        'href=' + location.href,
        'secureContext=' + window.isSecureContext,
        'bridge=' + (window.geckoOS ? 'present' : 'ABSENT'),
        'chrome: ' + CHROME,
      ];
      if (window.geckoOS) {
        lines.push('initialized=' + window.geckoOS.initialized);
        lines.push('apis=' + Object.keys(window.geckoOS).sort().join(','));
        try {
          const info = await window.geckoOS.getSystemInfo();
          lines.push('getSystemInfo=ok');
        } catch (e) {
          lines.push('getSystemInfo=FAILED ' + e);
        }
        // Alpha 5 exit criterion: "an app-raised notification appears as a
        // toast and lands in the centre". This is the raising half, from a
        // real third-party origin. The bridge must stamp appId
        // com.pyxis.hello onto it, and the capability check must pass on
        // the `notifications` permission this package declares.
        if (!notified && window.geckoOS.notification) {
          notified = true;
          try {
            const res = await window.geckoOS.notification.show('Hello Pyxis', {
              body: 'Raised by com.pyxis.hello over the bridge.',
              timeout: 15000,
            });
            lines.push('notify=ok ' + (res && res.notificationId));
          } catch (e) {
            lines.push('notify=FAILED ' + e);
          }
        }
      }
      // Alpha 5 exit criterion: "audio plays from a web page in vela". A
      // one-second 440 Hz tone through Web Audio, which the serial harness's
      // sound card records (#!listen). The AudioContext's state says whether
      // autoplay let it start: "running" if so, "suspended" if Firefox's
      // autoplay block (lifted for apps in Nova's user.js) held it back.
      if (!beeped) {
        beeped = true;
        try {
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.3;
          osc.frequency.value = 440;
          osc.connect(gain).connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1);
          lines.push('audio=' + ctx.state);
        } catch (e) {
          lines.push('audio=FAILED ' + e);
        }
      }
      out.textContent = lines.join('\n');

      if (window.geckoOS?.filesystem) {
        try {
          // One file per launch, not appendFile — appendFile wrote nothing
          // at all on device (the file did not exist and was not created),
          // and the whole question is how launch 2 differs from launch 1,
          // so each launch needs its own record rather than overwriting.
          await window.geckoOS.filesystem.writeFile(
            PROOF.replace('.txt', '-' + Date.now() + '.txt'),
            lines.join('\n') + '\n'
          );
        } catch (e) {
          // Nothing else to do — the absence of the file IS the result.
          out.textContent += '\nwriteFile FAILED: ' + e;
        }
      }
    }

    // Wait for the bridge if it has not attached yet: the JSWindowActor's
    // cross-process creation can lag the page's own scripts (observed under
    // QEMU's gtk display), so a synchronous check alone reports a false
    // ABSENT. See waitForGeckoOSReady in EchoClient.ts for the same bug.
    if (window.geckoOS?.initialized) {
      probe();
    } else {
      window.addEventListener('geckoOSReady', probe, { once: true });
      setTimeout(probe, 4000);
    }
  </script>
</body>
</html>
