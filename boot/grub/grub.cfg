# ============================================================================
# GeckoOS GRUB 2 Configuration - UEFI/GPT Edition
# ============================================================================
# Bootloader configuration for Firefox-based desktop OS
# Optimized for UEFI + GPT partition layout
# 
# Partition Layout:
#   hd0,gpt1  -> EFI System Partition (ESP) - 512MB FAT32
#   hd0,gpt2  -> Root filesystem partition (ext4, btrfs, etc)
# 
# Device Mapping:
#   hd0,gpt1  -> /dev/sda1
#   hd0,gpt2  -> /dev/sda2
# ============================================================================

# ============================================================================
# CRITICAL UEFI FIX: Root filesystem detection
# ============================================================================
# IMPORTANT: In UEFI systems, GRUB must read grub.cfg from the EFI partition,
# but the kernel and initramfs are typically on the root partition.
# This means we need to set root=(hd0,gpt2) NOT (hd0,gpt1)


# Set root to the actual root filesystem (where /boot lives)
# set root='(hd0,gpt2)'

# Alternative: Use UUID-based detection (more reliable)
# Uncomment below if you have set a filesystem label
# search --no-floppy --label geckoOS-root --set root
# OR use UUID:
#search --no-floppy --fs-uuid 16d0b2c2-1c9c-4309-b0f0-ac0ddd6b7559 --set root


# ============================================================================
# GRUB DEFAULTS & DISPLAY
# ============================================================================
### GRUB2 Settings
set default=0
set timeout=5
set timeout_style=menu

# Graphics mode (optional)
set gfxmode=auto
insmod gfxterm
insmod part_gpt
insmod ext2
insmod fat
insmod efi_gop
insmod efi_uga
insmod gzio

# Color scheme
# set color_normal=white/black
# set color_highlight=black/white

# Uncomment for GRUB2 debugging
# set debug=all

### Helper Functions
function load_video {
    if [ x$feature_all_video_module = xy ]; then
        insmod all_video
    else
        insmod efi_gop
        insmod efi_uga
        insmod video_bochs
        insmod video_cirrus
    fi
}

function gfxmode {
    set gfxpayload="${1}"
}


# ============================================================================
# REQUIRED MODULES FOR FILESYSTEMS
# ============================================================================
# Load filesystem drivers based on your root partition filesystem
# If using ext4:
# insmod ext2

# If using btrfs (uncomment):
# insmod btrfs

# If using xfs (uncomment):
# insmod xfs

# Load LVM/LUKS if encrypted (uncomment as needed):
# insmod lvm
# insmod luks


# ============================================================================
# MAIN BOOT ENTRY
# ============================================================================

menuentry 'GeckoOS Linux (UEFI/GPT)' --class gnu-linux --class gnu --class os {
  echo 'Booting GeckoOS...'
  insmod gfxterm
  insmod part_gpt
  insmod ext2
  insmod fat
  insmod efi_gop
  insmod efi_uga
  insmod gzio

  # Load kernel from ESP
  search --no-floppy --label GECKOOS-ESP --set=root
  echo "Kernel partition: $root"

  # Verify kernel exists
  if [ -f /vmlinuz ]; then
      echo "✓ Found kernel /vmlinuz"
  else
      echo "✗ Kernel missing - listing ESP root:"
      ls -l /
      configfile /boot/grub/grub.cfg  # Fallback to rootfs grub.cfg
  fi

  # Boot with UUID (stable) + serial console for QEMU
  linux /vmlinuz root=UUID=0c2fdb9d-7092-48a3-a5d5-0213bea72389 rw console=ttyS0,115200 console=tty0 loglevel=7 earlyprintk=serial
  initrd /init.cpio.gz
}


# ============================================================================
# RECOVERY ENTRY - SINGLE USER MODE
# ============================================================================

menuentry 'GeckoOS - Recovery Mode (Single User)' --class gnu-linux --class os {
  echo 'Booting GeckoOS in recovery mode...'
  
  set root='(hd0,gpt2)'
  search --no-floppy --label geckoOS-root --set root
  
  insmod gzio
  insmod ext2
  
  echo "Loading kernel (single-user mode)..."
  
  # single: Boot to single-user shell
  # rw: Mount filesystem read-write (needed for repairs)
  linux /boot/vmlinuz root=UUID=0c2fdb9d-7092-48a3-a5d5-0213bea72389 rw single console=ttyS0,115200 console=tty0
  
  if [ -f /boot/initramfs.img ]; then
    echo "Loading initramfs..."
    initrd /boot/initramfs.img
  fi
}


# ============================================================================
# DEBUG ENTRY - VERBOSE BOOT LOGGING
# ============================================================================

menuentry 'GeckoOS - Debug Mode (Verbose)' --class gnu-linux --class os {
  echo 'Booting GeckoOS in debug mode...'
  
  set root='(hd0,gpt2)'
  search --no-floppy --label geckoOS-root --set root
  
  insmod gzio
  insmod ext2
  
  echo "Loading kernel (debug mode)..."
  
  # Enable maximum verbosity for debugging
  # debug: Enable kernel debug output
  # loglevel=7: Maximum kernel log level
  # earlyprintk: Show kernel output from earliest boot
  linux /boot/vmlinuz root=UUID=0c2fdb9d-7092-48a3-a5d5-0213bea72389 rw debug loglevel=7 earlyprintk=serial,keep console=ttyS0,115200 console=tty0
  
  if [ -f /boot/initramfs.img ]; then
    echo "Loading initramfs..."
    initrd /boot/initramfs.img
  fi
}


# ============================================================================
# UEFI-SPECIFIC ENTRIES (Only on UEFI systems)
# ============================================================================

if [ "${grub_platform}" = "efi" ]; then
  
  menuentry 'UEFI Firmware Settings' --class=efi --id=efi-settings {
    echo "Restarting system to access UEFI Firmware Settings..."
    fwsetup
  }
  
  menuentry 'UEFI Boot Manager' --class=efi --id=efi-bootmgr {
    echo "Launching UEFI Boot Manager..."
    # Note: Availability depends on firmware
    reboot
  }
  
fi


# ============================================================================
# ALTERNATE BOOT ENTRIES (Chainloading)
# ============================================================================

### Boot from first disk (MBR chainload) - rarely used with GPT ###
menuentry 'Chainload First Hard Disk' --class=dos {
  echo "Chainloading bootloader from first hard disk..."
  insmod chain
  insmod part_msdos
  set root=(hd0)
  chainloader +1
}


# ============================================================================
# END OF CONFIGURATION
# ============================================================================
