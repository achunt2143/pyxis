### BEGIN /etc/grub.d/00_header ###
# GeckoOS GRUB 2 Configuration
# Bootloader configuration for Firefox-based desktop OS

# ============================================================================
# GRUB DEFAULTS
# ============================================================================
set default="0"
set timeout="5"
set timeout_style=menu
set saved_entry=""

# ============================================================================
# COLOR & DISPLAY SETTINGS
# ============================================================================
if [ "${saved_entry}" ]; then
  set default="${saved_entry}"
fi

# Set color scheme
if [ "${color_highlight}" != "white/black" ]; then
  set color_highlight=black/white
  set color_normal=white/black
fi

# ============================================================================
# THEME & APPEARANCE
# ============================================================================
# Check for UEFI and set appropriate mode
if [ "${grub_platform}" = "efi" ]; then
  echo "Booting in UEFI mode"
  set gfxmode=auto
else
  echo "Booting in BIOS mode"
  set gfxmode=800x600
fi

# Terminal output
set terminal_input=console
set terminal_output=console
if [ "${grub_platform}" = "efi" ]; then
  set terminal_output=gfxterm
fi

# Attempt to set gfxterm
if [ x$feature_gfxterm = xy ]; then
  insmod gfxterm
  insmod part_msdos
  insmod ext2
  if [ x$feature_platform_search_hint = xy ]; then
    search --no-floppy --label geckoOS --set root --hint-ieee1275='ieee1275//disk@0,msdos2' --hint-efi='hd0,msdos2' --hint-baremetal='ahci0,msdos2'  --hint='hd0,msdos2'
  else
    search --no-floppy --label geckoOS --set root
  fi
fi

# Enable terminal graphics
if [ "${grub_platform}" != "efi" ]; then
  terminal_output console
fi

### END /etc/grub.d/00_header ###

# ============================================================================
# BOOT ENTRIES
# ============================================================================

### BEGIN /etc/grub.d/10_linux ###
# Main GeckoOS Entry
menuentry 'GeckoOS Linux (Firefox-based Desktop)' --class gnu-linux --class os {
  echo 'Loading GeckoOS...'
  search --no-floppy --label geckoOS --set root
  echo "Root device: ${root}"
  
  # Load kernel
  insmod gzio
  insmod part_msdos
  insmod ext2
  
  # Display loading messages
  echo "Loading kernel..."
  linux /boot/bzImage-geckoOS root=LABEL=geckoOS ro quiet splash vga=ask
  
  # Load initramfs
  echo "Loading initramfs..."
  initrd /boot/initramfs-geckoOS.img
  
  echo 'Boot entry loaded. Press any key to continue...'
}

# ============================================================================
# ADVANCED / RECOVERY ENTRIES
# ============================================================================

### BEGIN Recovery Boot ###
menuentry 'GeckoOS Recovery Mode' --class gnu-linux --class os {
  echo 'Loading GeckoOS Recovery...'
  search --no-floppy --label geckoOS --set root
  
  insmod gzio
  insmod part_msdos
  insmod ext2
  
  echo "Loading kernel (recovery mode)..."
  linux /boot/bzImage-geckoOS root=LABEL=geckoOS ro single
  
  echo "Loading initramfs..."
  initrd /boot/initramfs-geckoOS.img
  
  echo 'Booting into recovery shell...'
}

### BEGIN Debug Boot ###
menuentry 'GeckoOS Debug Mode' --class gnu-linux --class os {
  echo 'Loading GeckoOS Debug...'
  search --no-floppy --label geckoOS --set root
  
  insmod gzio
  insmod part_msdos
  insmod ext2
  
  echo "Loading kernel (debug mode)..."
  linux /boot/bzImage-geckoOS root=LABEL=geckoOS ro debug verbose
  
  echo "Loading initramfs..."
  initrd /boot/initramfs-geckoOS.img
  
  echo 'Booting into debug mode...'
}

### BEGIN UEFI Shell (if available) ###
if [ "${grub_platform}" = "efi" ]; then
  menuentry "UEFI Firmware Settings" {
    echo "Loading UEFI Firmware Settings..."
    fwsetup
  }
fi

### BEGIN Boot from First Hard Disk ###
menuentry 'Boot from first hard disk' {
  insmod chain
  set root=(hd0)
  chainloader +1
}

# ============================================================================
# GRUB CONFIGURATION
# ============================================================================

### END /etc/grub.d/10_linux ###

# Custom configuration
if [ -f ${config_directory}/custom.cfg ]; then
  source ${config_directory}/custom.cfg
fi

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

# Uncomment to enable GRUB password protection
# set superusers="root"
# password_pbkdf2 root grub.pbkdf2.sha512.10000.HASH_HERE

# ============================================================================
# TERMINAL & INPUT
# ============================================================================

# Set keyboard input
terminal_input console
if [ "${grub_platform}" = "efi" ]; then
  terminal_input at_keyboard
fi

# Enable menu navigation with arrow keys
set pager=1

# ============================================================================
# ADVANCED FEATURES
# ============================================================================

# Automatically load all available kernels
### BEGIN Auto-load search (optional, commented out)
# search --no-floppy --label geckoOS --set root
### END Auto-load search

# Multiboot support (for future use)
# insmod multiboot
# insmod part_gpt

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================

# Set default boot device
set root=(hd0,msdos1)

# Boot timeout (in seconds)
set timeout=5

# Default menu entry (0-indexed)
set default=0

# ============================================================================
# END GRUB CONFIGURATION
# ============================================================================

# Final message
echo "GeckoOS Bootloader Ready"
echo "Press ESC to see menu or wait 5 seconds..."

# Load defaults from files
if [ -f /etc/default/grub ]; then
  . /etc/default/grub
fi

if [ -f /etc/grub.d/40_custom ]; then
  . /etc/grub.d/40_custom
fi
