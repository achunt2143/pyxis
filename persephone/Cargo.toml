[package]
name = "geckoOS-persephone"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
# IPC Bus client
geckoOS-echo = { path = "../echo" }
geckoOS-gaia-shell = { path = "../gaia" }
# Process management
libc = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "resource"] }
users = { workspace = true }
clap = { workspace = true }
# Wayland
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }
# X11
x11 = { workspace = true }
# DBus
zbus = { workspace = true, features = ["tokio"] }
# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Errors
anyhow = { workspace = true }
thiserror = { workspace = true }
# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# Data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }
# UUID
uuid = { workspace = true, features = ["v4"] }
# Time
chrono = { workspace = true }
# Environment
which = { workspace = true }
shellexpand = { workspace = true }
# Security
goblin = { workspace = true }

[lib]
name = "geckoOS_persephone"
path = "src/lib.rs"

[[bin]]
name = "persephone-daemon"
path = "bin/daemon.rs"

[[bin]]
name = "persephone-compat"
path = "bin/compat.rs"


