[package]
name = "geckoOS-persephone"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# IPC Bus client
geckoOS-ipc-bus = { path = "../ipc-bus" }
# Process management
libc = "0.2"
nix = { version = "0.27", features = ["process", "signal"] }
users = "0.11"
# Wayland
wayland-client = "0.30"
wayland-protocols = { version = "0.30", features = ["client"] }
# X11
x11-rb = "0.10"
# DBus
zbus = { version = "3.0", features = ["tokio"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
anyhow = "1.0"
thiserror = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Data structures
dashmap = "5.5"
parking_lot = "0.12"
# UUID
uuid = { version = "1.0", features = ["v4"] }
# Time
chrono = "0.4"
# Environment
which = "5.0"
shell-expand = "0.2"
# Security
users-groups = "0.1"
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[lib]
name = "geckoOS_persephone"
path = "src/lib.rs"

[[bin]]
name = "persephone-daemon"
path = "bin/daemon.rs"

[[bin]]
name = "persephone-compat"
path = "bin/compat.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
