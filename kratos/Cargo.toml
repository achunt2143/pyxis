[package]
name = "geckoOS-kratos"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Echo (renamed IPC Bus)
geckoOS-echo = { path = "../echo" }
# GPU acceleration
wgpu = { version = "0.17", features = ["webgpu", "metal", "vulkan", "dx12"] }
wgpu-hal = "0.17"
# Rendering optimization
naga = "0.13"
# Performance monitoring
metrics = "0.21"
prometheus = "0.13"
# Profiling
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }
# Benchmarking
criterion = "0.5"
# Caching
lru = "0.12"
parking_lot = "0.12"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
anyhow = "1.0"
thiserror = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Data structures
dashmap = "5.5"
# Concurrency
crossbeam = "0.8"
rayon = "1.7"
# Time
chrono = "0.4"
anyhow = { workspace = true }
tracing = { workspace = true }

[lib]
name = "geckoOS_kratos"
path = "src/lib.rs"

[[bin]]
name = "performance-tuner"
path = "bin/tuner.rs"

[[bin]]
name = "gpu-accelerator"
path = "bin/accelerator.rs"

[[bin]]
name = "performance-monitor"
path = "bin/monitor.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
