[package]
name = "geckoOS"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["GeckoOS Contributors"]
description = "A Firefox Gecko-based desktop operating system built on Linux kernel"
license = "MPL-2.0"
repository = "https://github.com/gecko-os/geckoOS"

[workspace]
members = [
    "ouranos",
    "cronus",
    "echo",
    "gaia",
    "gecko",
    "kratos",
    "persephone",
]

[workspace.dependencies]
smithay = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[dependencies]
# Web Framework & HTTP
actix-web = "4.4"
actix-rt = "2.9"
actix-web-actors = "4.2"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Async & Concurrency
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Wayland & Graphics (Smithay-based)
smithay = { version = "0.3", features = ["backend_drm", "backend_libinput", "renderer_gl"] }
wayland-server = "0.31"
wayland-client = "0.31"
wayland-protocols = "0.31"
x11-rb = "0.4"
drm = "0.5"
drm-fourcc = "4.1"
gbm = "0.14"

# GPU Rendering
glow = "0.13"
gl = "0.14"
image = "0.24"
texture-synthesis = "0.9"

# System & OS Integration
libc = "0.2"
nix = { version = "0.27", features = ["process", "signal", "mount", "user"] }
procfs = "0.15"
tempfile = "3.8"

# Device Management
udev = "0.8"
input = "0.8"
alsa = "0.9"

# Logging & Debugging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"

# Time & Scheduling
chrono = "0.4"

# FFI & C Interop
libxul-sys = { path = "./gecko-bindings/libxul-sys" }
bindgen = "0.69"

# Process Management
pgrep = "0.2"
signal-hook = "0.3"

# IPC & Networking
tokio-util = { version = "0.7", features = ["codec", "net"] }
bytes = "1.5"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

