# geckoos/Cargo.toml - Workspace Configuration
#
# Unified workspace for all GeckoOS components
# Run: cargo build --release --all

[workspace]
members = [
    "gecko",
    "cronus",
    "echo",
    "ouranos",
    "kratos",
    "persephone",
    "gaia",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GeckoOS Contributors"]
license = "MPL-2.0"

[workspace.dependencies]
# Wayland and compositor
smithay = { version = "0.7", features = ["backend_drm"] }
wayland-client = "0.30"
wayland-server = "0.30"
wayland-protocols = "0.31"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# IPC and DBus
zbus = "3.14"
zvariant = "4.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"

# Linux utilities
udev = "0.8"
input = "0.9.1"
drm = "0.6"
gbm = "0.15"
shellexpand = "3.1.1"
x11 = "2.21.0"
num_cpus = "1.16"
goblin = "0.8"

# System
libc = "0.2"
nix = { version = "0.27", features = ["process", "signal", "resource", "mount", "user"] }

# Graphics/Rendering
wgpu = "27.0.1"
wgpu-hal = "27.0.4"
image = "0.24"
glow = "0.13"
gl = "0.14"

#Async and Misc
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
bytes = "1.5"
tokio-util = { version = "0.7", features = ["codec", "net"] }

# Misc
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
chrono = "0.4"
bitflags = "2.4"
hashbrown = "0.14"
indexmap = "2.1"
crossbeam-channel = "0.5"
glutin = "0.31"
calloop = "0.12"
xkbcommon = "0.7"
drm-fourcc = "2.2.0"
nalgebra = "0.32"
cgmath = "0.18"
arc-swap = "1.6"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }
bincode = "1.3"
num = "0.4"
regex = "1.10"
xml-rs = "0.8"
which = "5.0"
users = "0.11"
dashmap = "6.1"
procfs = "0.15"
metrics = "0.21"
prometheus = "0.13"
pprof = "0.13"
criterion = "0.5"
lru = "0.12"
crossbeam = "0.8"
rayon = "1.7"
naga = "0.13"
subprocess = "0.2"
clap = { version = "4.5", features = ["derive"] }
tokio-stream = { version = "0.1.17", features = ["net"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
debug = false

[profile.dev]
opt-level = 0
debug = true

# Per-package configuration
[workspace.metadata.gecko]
description = "Firefox Gecko rendering engine integration"
features = ["wayland", "gpu-rendering"]

[workspace.metadata.cronus]
description = "Process manager and lifecycle control"
features = ["dbus", "signals"]

[workspace.metadata.echo]
description = "Inter-process communication bus"
features = ["dbus", "unix-sockets"]

[workspace.metadata.ouranos]
description = "Wayland compositor (Smithay-based)"
features = ["wayland", "drm", "libinput"]

[workspace.metadata.kratos]
description = "Performance monitoring and optimization"
features = ["gpu-monitoring", "profiling"]

[workspace.metadata.persephone]
description = "Linux application compatibility layer"
features = ["elf-loading", "wayland"]

[workspace.metadata.gaia]
description = "Desktop shell and UI framework"
features = ["web-frontend", "rust-backend"]

# Build settings for Gecko (special handling for C++ integration)
[workspace.metadata.cargo-tarpaulin]
exclude-files = ["gecko/src/gecko-wrapper.cpp", "gecko/src/*-bridge.cpp"]

# Note: Individual Cargo.toml files for each package override these settings
# This workspace file provides unified dependency management and build configuration
