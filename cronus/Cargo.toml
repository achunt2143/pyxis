[package]
name = "geckoOS-cronus"
version = "0.1.0"
edition = "2021"

[dependencies]
# Process management
nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Data structures
dashmap = "5.5"
parking_lot = "0.12"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# UUID and IDs
uuid = { version = "1.0", features = ["v4"] }
# Time handling
chrono = "0.4"
# Process utilities
procfs = "0.15"
# Concurrency
crossbeam-channel = "0.5"
# Math for resource limits
num = "0.4"
anyhow = { workspace = true }
tracing = { workspace = true }


[lib]
name = "geckoOS_cronus"
path = "src/lib.rs"

[[bin]]
name = "cronus-daemon"
path = "bin/daemon.rs"

[[bin]]
name = "cronus"
path = "bin/cli.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
