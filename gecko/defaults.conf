# GeckoOS Gecko Integration - Runtime Configuration
# Location: /etc/geckoOS/defaults.conf
# This file configures runtime behavior of the Gecko integration layer

[graphics]
# Display resolution (defaults to 1920x1080)
display_width = 1920
display_height = 1080
display_refresh_rate = 60

# Graphics backend: vulkan or opengl
# vulkan is recommended for modern GPUs, opengl for compatibility
rendering_backend = vulkan

# GPU acceleration (true/false)
use_gpu_acceleration = true

# Vertical sync (true/false)
enable_vsync = true

# Frame rate limit (0 = unlimited, usually 60)
max_frame_rate = 60

[memory]
# Maximum cache size in MB (default 512)
max_cache_size_mb = 512

# Initial JavaScript heap size in MB (default 128)
initial_heap_size_mb = 128

# Maximum JavaScript heap size in MB (default 1024)
max_heap_size_mb = 1024

# Enable memory compression (true/false)
enable_compression = true

[performance]
# Enable JIT compilation (true/false)
enable_jit = true

# Enable incremental rendering (true/false)
enable_incremental_rendering = true

# Dirty region tracking for optimization (true/false)
enable_dirty_region_tracking = true

# GPU memory pooling (true/false)
enable_memory_pooling = true

[ipc]
# DBus timeout in milliseconds
dbus_timeout_ms = 5000

# IPC message batching (true/false)
enable_message_batching = true

# Maximum batch size before sending
max_batch_size = 100

# Batch timeout in milliseconds
batch_timeout_ms = 50

[websocket]
# WebSocket server port
server_port = 8000

# Maximum concurrent connections
max_connections = 100

# Message timeout in milliseconds
message_timeout_ms = 30000

# Enable SSL/TLS (true/false)
enable_ssl = false

# SSL certificate path (if enabled)
ssl_certificate = /etc/geckoOS/certs/server.crt

# SSL key path (if enabled)
ssl_key = /etc/geckoOS/certs/server.key

[logging]
# Log level: debug, info, warn, error
log_level = info

# Log file path
log_file = /var/log/geckoOS/gecko.log

# Maximum log file size in MB before rotation
log_max_size_mb = 100

# Number of rotated log files to keep
log_retention_count = 10

# Enable console logging (true/false)
enable_console_logging = true

[debug]
# Debug mode (true/false)
debug_mode = false

# Verbose logging (true/false)
verbose_logging = false

# Enable profiling (true/false)
enable_profiling = false

# Profile output file
profiling_output = /var/log/geckoOS/gecko-profile.json

[features]
# Enable WebGL support (true/false)
enable_webgl = true

# Enable WebAssembly (true/false)
enable_wasm = true

# Enable Service Workers (true/false)
enable_service_workers = true

# Enable offline support (true/false)
enable_offline_support = true

# Enable hardware video decoding (true/false)
enable_hw_video_decode = true

# Enable audio hardware acceleration (true/false)
enable_hw_audio = true
