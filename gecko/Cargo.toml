[package]
name = "geckoOS-gecko-integration"
version = "0.1.0"
edition = "2021"

[dependencies]
# Gecko embedding
#geckoview = "140.0"  # Latest stable Gecko
#servo-angle = "0.1"
# Wayland client
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }
geckoOS-echo = { path = "../echo" }
# Async runtime
tokio = { workspace = true, features = ["full"] }
# IPC & communication
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# Graphics
gl = { workspace = true }
glutin = { workspace = true, features = ["wayland"] }
# JavaScript interop
neon = { version = "0.10", features = ["default"] }
# Storage
rusqlite = { version = "0.30", features = ["bundled"] }
# Concurrency
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
# Utilities
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }

[lib]
name = "geckoOS_gecko_integration"
path = "src/lib.rs"

[[bin]]
name = "gecko-shell"
path = "bin/gecko-shell.rs"

