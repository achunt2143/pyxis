        'singleton': True,
        'type': 'mozilla::net::PyxisProtocolHandler',
        'headers': ['/netwerk/protocol/pyxis/PyxisProtocolHandler.h'],
        'constructor': 'mozilla::net::PyxisProtocolHandler::GetOrCreate',
        'protocol_config': {
            'scheme': 'pyxis',
