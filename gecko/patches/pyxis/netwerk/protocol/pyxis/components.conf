# SCAFFOLD NOTICE (Pyxis, 2026-07-04): structure verified against the real
# pinned tree (ESR 140.0.5) — netwerk/protocol/gio/components.conf and
# netwerk/build/components.conf's moz-extension entry were used as the two
# closest real precedents (a self-contained-directory protocol with its own
# components.conf, and a URI_STD + trustworthy + local-resource protocol,
# respectively). See PyxisProtocolHandler.h for the full flag-by-flag
# rationale and for what changed versus the plan doc's original generic
# sketch (no URI_SANDBOXED flag exists at this pin; GetProtocolFlags() is
# not a real override point — 'protocol_config.flags' below is the sole
# source of truth).
#
# NOTE: unlike gio's single-scheme registration, moz-extension: is instead
# registered from the top-level netwerk/build/components.conf, not its own
# directory's file — so there IS real precedent both ways in this tree.
# Following gio's self-contained pattern here (own components.conf in this
# directory) keeps the whole pyxis:// patch series confined to
# netwerk/protocol/pyxis/ + one DIRS line in netwerk/protocol/moz.build,
# which is the smaller, more rebase-stable footprint the plan explicitly
# asks for (pyxis-scheme-and-kiosk-plan.md's "patch-series discipline" note).

