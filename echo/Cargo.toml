[package]
name = "geckoOS-echo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Networking
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
# Data structures
dashmap = "5.5"
parking_lot = "0.12"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
# Errors
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# UUID and IDs
uuid = { version = "1.0", features = ["v4"] }
# Time
chrono = "0.4"
# Message queue
crossbeam-channel = "0.5"
# Pattern matching
regex = "1.10"
# D-Bus compatibility
xml-rs = "0.8"
# Unix sockets
nix = { version = "0.27", features = ["uio"] }
wayland-client = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[lib]
name = "geckoOS_echo"
path = "src/lib.rs"

[[bin]]
name = "echo-daemon"
path = "bin/daemon.rs"

[[bin]]
name = "wcho-cli"
path = "bin/client.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
