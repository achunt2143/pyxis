[package]
name = "geckoOS-echo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
# Networking
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
# Data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }
# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true }
# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }
# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# UUID and IDs
uuid = { workspace = true, features = ["v4"] }
# Time
chrono = { workspace = true }
# Message queue
crossbeam-channel = { workspace = true }
# Pattern matching
regex = { workspace = true }
# Unix sockets
tokio-stream = { workspace = true, features = ["net"] }
futures = { workspace = true }
# CLI
clap = { workspace = true, features = ["derive"] }
# Unix signals / process control
# "term" adds nix::pty (openpty) for the real terminal service (see
# services/terminal.rs) on top of the workspace's base feature set.
nix = { workspace = true, features = ["term"] }
libc = { workspace = true }

[lib]
name = "geckoOS_echo"
path = "src/lib.rs"

[[bin]]
name = "echo-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "echo-cli"
path = "src/bin/client.rs"

# Device-side launcher/registry control for ipk-packaged apps — thin Echo
# client over org.geckoOS.nova (see src/bin/appctl.rs's doc comment for why
# this is not a standalone registry daemon).
[[bin]]
name = "pyxis-appctl"
path = "src/bin/appctl.rs"

[dev-dependencies]
tempfile = "3.8"
