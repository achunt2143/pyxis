[package]
name = "geckoOS-ouranos"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay = { workspace = true, features = ["wayland_frontend", "backend_drm", "backend_libinput", "backend_egl"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
calloop = { workspace = true }
wayland-server = { workspace = true }
wayland-protocols = { workspace = true, features = ["server"] }
xkbcommon = { workspace = true }
input = { workspace = true }
gl = { workspace = true }
glutin = { workspace = true, features = ["wayland"] }
drm = { workspace = true }
drm-fourcc = { workspace = true }
gbm = { workspace = true }
udev = { workspace = true }
image = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
toml = { workspace = true }
nalgebra = { workspace = true, features = ["serde-serialize"] }
cgmath = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
once_cell = { workspace = true }
lazy_static = { workspace = true }
wayland-client = { workspace = true }

[[bin]]
name = "geckoOS-ouranos"
path = "src/main.rs"

# Testing and benchmarking
#[dev-dependencies]
#criterion = { workspace = true }
#tempfile = { workspace = true }
#mockito = { workspace = true }

#[[bench]]
#name = "rendering_benchmarks"
#harness = false

#[[bench]]
#name = "input_latency"
#harness = false

[features]
default = ["drm-support", "libinput_backend", "egl-backend"]
drm-support = []
libinput_backend = []
egl-backend = []
#profiling = ["smithay/profiling"]
debug = []



