<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaia Enhanced - Desktop Shell v2.0</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/accessibility.css">
</head>
<body class="gaia-shell" role="application" aria-label="Gaia Desktop Environment">
    <!-- Taskbar -->
    <div id="taskbar" role="navigation" aria-label="Taskbar" class="taskbar"></div>

    <!-- Sidebar -->
    <aside id="sidebar" role="complementary" aria-label="Sidebar" class="sidebar"></aside>

    <!-- Main Desktop Area -->
    <main id="desktop" role="main" aria-label="Desktop" class="desktop">
        <!-- Dashboard -->
        <div id="dashboard" role="region" aria-label="Dashboard" class="dashboard"></div>
        
        <!-- Windows Container -->
        <div id="windows-container" role="region" aria-label="Application Windows" class="windows-container"></div>
    </main>

    <!-- Context Menu -->
    <div id="context-menu" role="menu" aria-hidden="true" class="context-menu"></div>

    <!-- Notifications -->
    <div id="notifications" role="region" aria-label="Notifications" aria-live="polite" class="notifications"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" role="presentation" aria-hidden="true" class="modal-overlay"></div>

    <!-- Startup Scripts -->
    <script type="module" src="scripts/app.js"></script>
    <script src="scripts/module-loader.js"></script>
    <script src="scripts/gpu-renderer.js"></script>
</body>
</html>
