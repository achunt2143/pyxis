[package]
name = "geckoOS-gaia-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4"
actix-files = "0.6"
actix-rt = "2"
# WebSockets
tokio-tungstenite = "0.21"
tokio = { version = "1", features = ["full"] }
# IPC Bus client
geckoOS-ipc-bus = { path = "../ipc-bus" }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
anyhow = "1.0"
thiserror = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# UUID
uuid = { version = "1.0", features = ["v4"] }
# Time
chrono = "0.4"
# Concurrency
dashmap = "5.5"
parking_lot = "0.12"
# Shell utilities
which = "5.0"
subprocess = "0.2"
users = "0.11"
wayland-client = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[lib]
name = "geckoOS_gaia"
path = "src/lib.rs"

[[bin]]
name = "gaia-shell"
path = "src/bin/shell.rs"

[[bin]]
name = "gaia-daemon"
path = "src/bin/daemon.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
