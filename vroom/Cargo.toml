# Vroom — the Pyxis SDK/PDK packaging toolchain.
#
# Builds, packages, installs, and debugs Pyxis applications:
#   - SDK  (web apps:    HTML/CSS/JS/TS, `runtime = "web"`)
#   - PDK  (native apps: C/C++/Rust/etc, `runtime = "native"`)
#
# One package format (.ipk), one app manifest (appinfo.json), one project
# file (pyxis.json). Spec: docs/pyxis-sdk-pdk-spec.md, schemas: schemas/.

[package]
name = "geckoOS-vroom"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

[lib]
name = "geckoOS_vroom"
path = "src/lib.rs"

[[bin]]
name = "pyxis"
path = "bin/pyxis.rs"

[[bin]]
name = "pyxis-sdk"
path = "bin/sdk.rs"

[[bin]]
name = "pyxis-pdk"
path = "bin/pdk.rs"
